<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تطبيق العائلة</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- شاشة الدخول السريع للعائلة -->
  <div id="login-screen" class="screen active">
    <div class="login-box">
      <h2>🏡 تطبيق العائلة الخاص</h2>
      <p>أدخل اسمك ورمز العائلة للدخول</p>
      <input type="text" id="username-input" placeholder="اسمك (مثال: أحمد)" />
      <input type="password" id="family-code-input" placeholder="رمز العائلة السري (مثال: 1234)" />
      <button onclick="login()">دخول للمحادثة</button>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <!-- شاشة الدردشة والمكالمات -->
  <div id="chat-screen" class="screen">
    <header class="chat-header">
      <div class="family-info">
        <h3>غرفة العائلة 🤍</h3>
        <span id="current-user-label">متصل الآن</span>
      </div>
      <div class="call-buttons">
        <button type="button" class="call-btn voice" onclick="startCall('صوتية')" title="مكالمة صوتية">📞</button>
        <button type="button" class="call-btn video" onclick="startCall('فيديو')" title="مكالمة فيديو">📹</button>
      </div>
    </header>

    <!-- نافذة المكالمة النشطة (مخفية افتراضياً) -->
    <div id="call-banner" class="call-banner hidden">
      <span id="call-status-text">جاري الاتصال...</span>
      <button  type="button"class="end-call-btn" onclick="endCall()">إنهاء المكالمة ❌</button>
    </div>

    <!-- منطقة عرض الرسائل -->
    <main id="messages-container" class="messages-container"></main>
    <div id="video-call-area"></div>

    <!-- شريط كتابة وإرسال الرسائل -->
    <footer class="chat-input-area">
      <input type="text" id="message-input" placeholder="اكتب رسالتك للعائلة هنا..." onkeypress="handleKeyPress(event)" />
      <button onclick="sendMessage()">إرسال ➤</button>
    <div>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-"></script>
  <script src="https://meet.jit.si/external_api.js"></script>

  <script src="script.js"></script>
</body>
</html>
